# Election night: pull the official count from state election offices every few minutes and commit
# data/results-live.json, which the Election night tab reads. Times below are UTC (ET + 5).
name: Live results

on:
  schedule:
    - cron: '*/5 22-23 3 11 *'    # Tue Nov 3, 5–7 pm ET: first closings (Indiana/Kentucky at 6)
    - cron: '*/5 0-14 4 11 *'     # Tue 7 pm – Wed 9 am ET: election night
    - cron: '*/30 15-23 4 11 *'   # Wed daytime: late counting
    - cron: '0 */2 5-12 11 *'     # Nov 5–12, every two hours: mail ballots, Alaska's ranked-choice tabulation
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch (normal) or probe (record what each feed returns, for fitting the adapters)'
        default: fetch
        type: choice
        options: [fetch, loop, probe]
      minutes:
        description: 'loop mode: how long to keep running (max 350)'
        default: '340'

permissions:
  contents: write

concurrency:
  group: live-results
  cancel-in-progress: false   # a running loop holds the group; scheduled runs wait behind it

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.mode == 'loop' && 355 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pypdf
      - name: Probe the feeds
        if: ${{ github.event.inputs.mode == 'probe' }}
        run: |
          python3 scripts/fetch_results.py --probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-probe.json
          git commit -q -m "Probe of the live-results feeds" || true
          git push -q
      - name: Fetch and commit once
        if: ${{ github.event.inputs.mode != 'probe' && github.event.inputs.mode != 'loop' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/fetch_results.py
          python3 scripts/commit_results.py
      - name: Fetch and commit every 2 minutes (election night)
        if: ${{ github.event.inputs.mode == 'loop' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + ${{ github.event.inputs.minutes || 340 }} * 60))
          while [ $SECONDS -lt $end ]; do
            git checkout -q -- data/results-live.json 2>/dev/null || true
            git pull -q --rebase -X theirs origin main || git rebase --abort || true   # pick up hand edits to results-manual.json
            timeout 240 python3 scripts/fetch_results.py || echo "fetch failed"
            python3 scripts/commit_results.py || echo "commit failed"
            sleep 120
          done
